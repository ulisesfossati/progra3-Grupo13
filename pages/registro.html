<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cine Aurora 📽️ - Registro</title>
    <meta name="description" content="Cine Aurora - Registro" />
    <link rel="icon" href="../assets/favicon/logo-cine.png" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/components/registro.css">
    <link rel="stylesheet" href="../css/components/header.css">
    <link rel="stylesheet" href="../css/components/footer.css">
  </head>

  <body>
    <header class="header">
      <div class="header-container">
        <div class="header-logo">
          <img src="../assets/favicon/logo-cine.png" alt="logo-cine-aurora" />
          <h1>Cine Aurora</h1>
        </div>

        <nav class="nav">
          <a href="../index.html">Inicio</a>
          <a href="./estrenos.html">Próximos estrenos</a>
          <a href="../index.html" class="volver">Volver</a>
        </nav>
      </div>
    </header>

    <main>
      <div class="registro-container"> 
        <form action="login.html">
          <div class="registro-principal">

            <h2>Crear nueva cuenta</h2>

            <div class="form-group">
              <label for="nombre">Nombre Completo</label>
              <input type="text" id="nombre" required />
            </div>

            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" required />
            </div>

            <div class="form-group">
              <label for="fecha-nacimiento">Fecha de nacimiento</label>
              <input type="date" id="fecha-nacimiento" required />
            </div>

            <div class="form-group">
              <label for="contrasena">Contraseña</label>
              <input type="password" id="contrasena" required />
            </div>

            <div class="form-group">
              <label for="confirmar-contrasena">Confirmar contraseña</label>
              <input type="password" id="confirmar-contrasena" required />
            </div>

          </div>

          <fieldset class="additional-info">
            <legend>Datos para ayudar al cine</legend>
            <p>Estos datos nos ayudan a mejorar tu experiencia.</p>
            
            <div class="form-group">
              <label for="color-butaca">Elegí tu color favorito para las butacas</label>
              <input type="color" id="color-butaca" />
            </div>

            <div class="form-group">
              <label for="cantidad-entradas">¿Cuántas entradas comprás en general?</label>
              <input type="range" id="cantidad-entradas" min="0" max="10" />
            </div>

            <div class="form-group">
              <label for="genero-favorito">Seleccioná tu género favorito</label>
              <select id="genero-favorito">
                <option>Acción</option>
                <option>Drama</option>
                <option>Ciencia ficción</option>
                <option>Terror</option>
                <option>Comedia</option>
                <option>Romance</option>
              </select>
            </div>

            <div class="form-group">
              <label>Elegí tu snack favorito</label>
              <div class="radio-group">
                <label><input type="radio" name="snack" /> Pochoclo dulce</label>
                <label><input type="radio" name="snack" /> Pochoclo salado</label>
                <label><input type="radio" name="snack" /> Chocolate</label>
                <label><input type="radio" name="snack" /> Frutos secos</label>
              </div>
            </div>
          </fieldset>

          <div class="form-actions">
            <button class="botonregistro" type="submit">Regístrate</button>
          </div>
        </form>
      </div>
    </main>

    <footer class="footer">
      <div class="footer-container">
        <p>&copy; 2026 Cine Aurora</p>
        <p class="footer-sub">Todos los derechos reservados</p>
      </div>
    </footer>
  </body>
</html>
