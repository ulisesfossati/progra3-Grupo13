<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cine Aurora 📽️ - Login</title>
    <meta name="description" content="Cine Aurora - Login" />
    <link rel="icon" href="../assets/favicon/logo-cine.png" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/components/login.css" />
    <link rel="stylesheet" href="../css/components/footer.css">
    <link rel="stylesheet" href="../css/components/header.css">
  </head>

  <body>
    <header class="header">
      <div class="header-container">
        
        <div class="header-logo">
          <img src="../assets/favicon/logo-cine.png" alt="logo-cine-aurora" />
          <h1>Cine Aurora</h1>
        </div>
    
        <nav class="nav">
          <a href="../index.html" class="active">Inicio</a>
          <a href="./estrenos.html">Próximos estrenos</a>
          <a href="../index.html" class="volver">Volver</a>
        </nav>
    
      </div>
    </header>
    <main>
      <div class="container-imagen">
        <img src="../assets/img/cine.jpg" alt="login-image" />
      </div>
      <div class="login-main-container">
      <section class="login-main">
      <form action="perfil.html" class="login-form">
        <h2>Acceso Clientes</h2>
        <div class="login-form-item">
          <label>Email</label>
          <input type="email" required />
        </div>
        <div class="login-form-item">
          <label>Contraseña</label>
          <input type="password" required />
        </div>
        <button class="boton-formulario" type="submit">Ingresar</button>
        <p class="miembro" >¿No eres miembro? <a href="registro.html">Regístrate</a></p>
      </form>
    </section>
  </div>
    </main>

    <footer class="footer">
      <div class="footer-container">
        <p>&copy; 2026 Cine Aurora</p>
        <p class="footer-sub">Todos los derechos reservados</p>
      </div>
    </footer>
  </body>
</html>
